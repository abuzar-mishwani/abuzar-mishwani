<svg width="850" height="170" viewBox="0 0 850 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="hud-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#060c1c"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="top-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sharp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sci-Fi Grid -->
    <pattern id="matrix-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f5ff" stroke-width="0.5" stroke-opacity="0.06"/>
      <circle cx="24" cy="24" r="0.6" fill="#00f5ff" fill-opacity="0.25"/>
    </pattern>

    <style>
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .spin-cw {
        transform-origin: 755px 85px;
        animation: spinClockwise 20s linear infinite;
      }
      .spin-ccw {
        transform-origin: 755px 85px;
        animation: spinCounter 12s linear infinite;
      }
      .pulse-node {
        transform-origin: 755px 85px;
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .beacon {
        animation: beaconBlink 1.8s infinite ease-in-out;
      }

      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.3px;
      }
      .text-mono {
        font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Monaco, Consolas, monospace;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1.5" y="1.5" width="847" height="167" rx="10" fill="url(#hud-card-bg)" stroke="url(#border-glow)" stroke-width="1.2"/>
  <rect x="1.5" y="1.5" width="847" height="167" rx="10" fill="url(#matrix-grid)"/>

  <!-- Top Laser Beam Accent -->
  <rect x="40" y="1.5" width="770" height="1.8" fill="url(#top-beam)"/>

  <!-- Top Telemetry Status Header -->
  <g transform="translate(32, 28)" class="text-mono">
    <!-- Live Status Dot -->
    <circle cx="5" cy="5" r="4.5" fill="#00f5ff" class="beacon" filter="url(#sharp-glow)"/>
    <circle cx="5" cy="5" r="2" fill="#ffffff"/>

    <text x="18" y="9" fill="#00f5ff" font-size="10.5" font-weight="700">AUTONOMOUS NEURAL KERNEL</text>
    <text x="210" y="9" fill="#475569" font-size="10.5">│</text>
    <text x="226" y="9" fill="#94a3b8" font-size="10.5">INFERENCE: <tspan fill="#38bdf8" font-weight="600">ACTIVE</tspan></text>
    <text x="350" y="9" fill="#475569" font-size="10.5">│</text>
    <text x="366" y="9" fill="#94a3b8" font-size="10.5">LATENCY: <tspan fill="#a5b4fc" font-weight="600">&lt; 1ms</tspan></text>
    <text x="480" y="9" fill="#475569" font-size="10.5">│</text>
    <text x="496" y="9" fill="#64748b" font-size="10.5">SYS_ID: <tspan fill="#64748b">0x7E3-CORE</tspan></text>
  </g>

  <!-- Divider Rule -->
  <line x1="32" y1="44" x2="660" y2="44" stroke="#1e293b" stroke-width="1"/>
  <line x1="32" y1="44" x2="160" y2="44" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Main Headline / Mission -->
  <g transform="translate(32, 75)">
    <text x="0" y="0" fill="url(#neon-cyan)" class="text-title" filter="url(#sharp-glow)">
      COGNITIVE ARCHITECTURES &amp; SYSTEMS ENGINEERING
    </text>
  </g>

  <g transform="translate(32, 98)" class="text-mono">
    <text x="0" y="0" fill="#94a3b8" font-size="12">
      "Architecting autonomous intelligence to expand human frontiers."
    </text>
  </g>

  <!-- Triad of Core Vectors -->
  <g transform="translate(32, 138)" class="text-mono">
    <!-- Vector 1 -->
    <rect x="0" y="-14" width="186" height="24" rx="4" fill="#020816" stroke="#00f5ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="12" y="2" fill="#00f5ff" font-size="10.5" font-weight="600">◈ AGENTIC SWARMS</text>

    <!-- Vector 2 -->
    <rect x="198" y="-14" width="202" height="24" rx="4" fill="#020816" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="210" y="2" fill="#38bdf8" font-size="10.5" font-weight="600">⚡ DEEP LEARNING &amp; LLMs</text>

    <!-- Vector 3 -->
    <rect x="412" y="-14" width="216" height="24" rx="4" fill="#020816" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="424" y="2" fill="#a5b4fc" font-size="10.5" font-weight="600">▲ HIGH-SCALE RUNTIMES</text>
  </g>

  <!-- Right Holographic Quantum/Neural Core -->
  <g>
    <!-- Background Radial Glow -->
    <circle cx="755" cy="85" r="60" fill="#00f5ff" fill-opacity="0.07" filter="url(#bloom)"/>

    <!-- Outer Orbital Ring -->
    <circle cx="755" cy="85" r="54" stroke="#00f5ff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Rotating Segmented Ring -->
    <circle cx="755" cy="85" r="46" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="1.6" stroke-dasharray="14 10 32 8" fill="none" class="spin-cw"/>

    <!-- Counter-Rotating Inner Ring -->
    <circle cx="755" cy="85" r="34" stroke="#818cf8" stroke-opacity="0.8" stroke-width="1.4" stroke-dasharray="6 6 20 6" fill="none" class="spin-ccw"/>

    <!-- High-Speed Core Ring -->
    <circle cx="755" cy="85" r="22" stroke="#00f5ff" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4 4" fill="none" class="spin-cw"/>

    <!-- Central Quantum Core -->
    <circle cx="755" cy="85" r="11" fill="#00f5ff" fill-opacity="0.3" class="pulse-node" filter="url(#bloom)"/>
    <circle cx="755" cy="85" r="6" fill="#00f5ff" filter="url(#sharp-glow)"/>
    <circle cx="755" cy="85" r="2.5" fill="#ffffff"/>

    <!-- Crosshair Target Reticles -->
    <line x1="755" y1="22" x2="755" y2="32" stroke="#00f5ff" stroke-width="1.2" opacity="0.6"/>
    <line x1="755" y1="138" x2="755" y2="148" stroke="#00f5ff" stroke-width="1.2" opacity="0.6"/>
    <line x1="692" y1="85" x2="702" y2="85" stroke="#00f5ff" stroke-width="1.2" opacity="0.6"/>
    <line x1="808" y1="85" x2="818" y2="85" stroke="#00f5ff" stroke-width="1.2" opacity="0.6"/>

    <!-- Micro Tech Coordinate Label -->
    <text x="755" y="158" text-anchor="middle" fill="#475569" font-family="'SF Mono', Monaco, monospace" font-size="8.5" letter-spacing="1px">
      NEURAL-CORE // 48 TFLOPS
    </text>
  </g>

  <!-- Corner Reticle Brackets -->
  <path d="M 10 20 L 10 10 L 20 10" stroke="#00f5ff" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 840 20 L 840 10 L 830 10" stroke="#00f5ff" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 10 150 L 10 160 L 20 160" stroke="#00f5ff" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M 840 150 L 840 160 L 830 160" stroke="#00f5ff" stroke-width="1.2" fill="none" opacity="0.7"/>
</svg>

